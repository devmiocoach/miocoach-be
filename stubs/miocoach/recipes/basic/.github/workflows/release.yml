name: Automatic Semantic Release

on:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    release:
        uses: miocoach-dev/miocoach/.github/workflows/semantic-release.yml@main
        with:
            version_file: 'module.json'
            version_file_path: '.version'
            prerelease: false
        secrets:
            APP_ID: ${{ secrets.APP_ID }}
            APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
